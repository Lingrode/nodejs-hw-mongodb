type: object
required:
  - name
  - email
properties:
  _id:
    description: User's unique identifier
    type: string
    example: 65ca67e7ae7f10c88b598384
  name:
    description: User's full name
    type: string
    minLength: 3
    maxLength: 30
    example: LeBron James
  email:
    description: User's email address
    type: string
    format: email
    example: lebron@example.com
