tags:
  - Auth
summary: Log in user
operationId: loginUser
description: |
  Authenticates the user with the provided email and password.
  If the credentials are valid, a token is returned.
  If the credentials are invalid, a 401 Unauthorized error is returned.
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            format: email
            example: lebron@example.com
          password:
            type: string
            format: password
            example: veryStrongPassword098
responses:
  '200':
    description: User successfully logged in
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2N2U1ZmU4NGUyYWQ5ZjI2NDhhM2U3NzE5YzY1YzgyIiwiaWF0IjoxNjE4ODc4NzU2LCJleHBpcmVkT2FjdGlvbiI6Im9mZmljZXJlZCBhY2NvdW50LCJpYXQiOjE2MTg4Nzg3NTZ9.'
  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    description: Unauthorized error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'User not found'
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'User not found'
