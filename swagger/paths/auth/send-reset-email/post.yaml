tags:
  - Auth
summary: Send password reset email
operationId: sendResetEmail
description: |
  Sends an email to the user with a password reset link. The user must provide a valid email address.
  If the email is valid, the reset link will be sent. If the email is not registered, an error will be returned.
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            format: email
            example: lebron@example.com
responses:
  '200':
    description: Reset email sent successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email has been successfully sent.
            data:
              type: object
              example: {}
  '400':
    $ref: '../../../components/responses/400.yaml'
  '404':
    description: Not found error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: NotFoundError
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'Contact not found'
