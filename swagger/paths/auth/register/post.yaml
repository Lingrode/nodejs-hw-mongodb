tags:
  - Auth
summary: Register a new user
operationId: registerUser
description: Creates a new user account.
  The user must provide a name, a valid email, and a password.
  If the email is already in use, a 409 Conflict error is returned.
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 30
            example: LeBron James
          email:
            type: string
            format: email
            example: lebron@example.com
          password:
            type: string
            format: password
            example: veryStrongPassword098
responses:
  '201':
    description: User successfully registered
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user
            data:
              type: object
              $ref: '../../../components/schemas/user.yaml'
  '400':
    $ref: ../../../components/responses/400.yaml
  '409':
    $ref: ../../../components/responses/409.yaml
