tags:
  - Contacts
summary: Patch contact by id
operationId: patchContact
description: >
  Updates a specific contact by its unique ID. 
  Allows modifying details such as name, phone number, email, and other attributes. 
  If the contact is successfully updated, it returns the modified contact data. 
  If the contact is not found, a 404 error is returned.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  description: Fields to update
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 20
            description: Contact's name
            example: LeBron James
          phoneNumber:
            type: string
            minLength: 3
            maxLength: 20
            description: Contact's phone number
            example: '+17801231212'
          email:
            type: string
            format: email
            description: Contact's email address
            example: example@example.com
          isFavourite:
            type: boolean
            description: Indicates whether the contact is a favorite
            example: false
          contactType:
            type: string
            description: 'Type of contact: work, home or personal'
            enum: ['work', 'home', 'personal']
          photo:
            type: string
            description: Optional photo file (will be uploaded to Cloudinary)
            format: binary
            example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
responses:
  '200':
    description: 'Success'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '401':
    $ref: ../../../components/responses/401.yaml
