openapi: 3.1.0
info:
  version: 1.0.0
  title: Contact Book
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: Contact Book is a web application for managing personal and business contacts. Users can add, edit, delete, and search for contacts, as well as upload profile pictures. The app supports user authentication and secure data management using access tokens.
tags:
  - name: Auth
    description: Endpoints for user authorization and authentication
  - name: Contacts
    description: Managing contacts (CRUD operations)
servers:
  - url: http://localhost:3000
  - url: https://hw2-mongodb-ewra.onrender.com
paths:
  /auth/register:
    post:
      $ref: '../swagger/paths/auth/register/post.yaml'
  /auth/login:
    post:
      $ref: '../swagger/paths/auth/login/post.yaml'
  /auth/logout:
    post: 
      $ref: '../swagger/paths/auth/logout/post.yaml'
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'
  /contacts/{id}:
    get:
      $ref: '../swagger/paths/contacts/{id}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{id}/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{id}/delete.yaml'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
